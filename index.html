<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <title>FlÃ¡vio Live</title>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--line:#252d3a;--text:#f4f6fb;--muted:#939cac;--ok:#65d990}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
    body{display:grid;place-items:center;padding:24px}
    .box{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center}
    h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px)}
    p{color:var(--muted);line-height:1.5;margin:0}
    .status{margin-top:22px;font-weight:800}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#697384;margin-right:7px}
    .dot.ok{background:var(--ok)}
    .small{font-size:12px;margin-top:16px;color:var(--muted)}
    button{margin-top:18px;border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="box">
    <h1>FLÃVIO LIVE</h1>
    <p id="message">Procurando a call...</p>
    <div class="status"><span id="dot" class="dot"></span><span id="state">VERIFICANDO</span></div>
    <button id="retry" hidden>ATUALIZAR AGORA</button>
    <div class="small">A call roda no PC do FlÃ¡vio. Esta pÃ¡gina sÃ³ encontra o tÃºnel atual.</div>
  </main>

<script>
const API = "https://api.github.com/repos/wthhunk/ninja/contents/endpoint.json?ref=main";
const KEY_STORE = "flavio_ninja_access_key_v1";
const ENDPOINT_STORE = "flavio_ninja_last_endpoint_v1";

const message = document.getElementById("message");
const state = document.getElementById("state");
const dot = document.getElementById("dot");
const retry = document.getElementById("retry");

let key = location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : "";
if (key) {
  localStorage.setItem(KEY_STORE, key);
  history.replaceState(null, "", location.pathname + location.search);
} else {
  key = localStorage.getItem(KEY_STORE) || "";
}

let attempts = 0;
let checking = false;

function setState(label, text, ok=false) {
  state.textContent = label;
  message.textContent = text;
  dot.classList.toggle("ok", ok);
}

async function fetchJson(url, timeout=5000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeout);
  try {
    const r = await fetch(url, {
      cache: "no-store",
      signal: ctrl.signal,
      headers: { "Accept": "application/vnd.github+json" }
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } finally {
    clearTimeout(timer);
  }
}

async function health(endpoint) {
  endpoint = String(endpoint || "").replace(/\/+$/, "");
  if (!endpoint.startsWith("https://")) return false;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 3500);
    try {
      const r = await fetch(endpoint + "/__flavio_public_health?t=" + Date.now(), {
        cache: "no-store",
        signal: ctrl.signal
      });
      if (!r.ok) return false;
      const j = await r.json();
      return !!j.ok;
    } finally {
      clearTimeout(timer);
    }
  } catch {
    return false;
  }
}

async function getEndpointFromGitHub() {
  const j = await fetchJson(API + "&t=" + Date.now(), 5000);
  if (!j.content) throw new Error("Sem content");
  const raw = atob(String(j.content).replace(/\s/g, ""));
  const ep = JSON.parse(raw);
  return String(ep.endpoint || "").replace(/\/+$/, "");
}

function nextDelay() {
  // Primeiros segundos: bem agressivo. Depois reduz para nÃ£o estourar o
  // limite anÃ´nimo da API do GitHub.
  if (attempts <= 1) return 3000;
  if (attempts === 2) return 5000;
  if (attempts === 3) return 10000;
  if (attempts === 4) return 20000;
  return 90000;
}

async function check(force=false) {
  if (checking) return;
  checking = true;
  retry.hidden = true;

  try {
    if (!key) {
      setState("LINK INCOMPLETO", "Abra o link privado completo que o FlÃ¡vio te enviou.");
      retry.hidden = false;
      return;
    }

    setState("VERIFICANDO", "Procurando a call...");

    // Primeiro tenta o tÃºnel que funcionou da Ãºltima vez. Isso evita GitHub
    // quando a mesma stream ainda estÃ¡ aberta.
    const saved = localStorage.getItem(ENDPOINT_STORE) || "";
    if (saved && await health(saved)) {
      setState("ONLINE", "Entrando na call...", true);
      location.replace(saved + "/join?k=" + encodeURIComponent(key));
      return;
    }

    // Se o tÃºnel antigo morreu, consulta diretamente o Contents API.
    const endpoint = await getEndpointFromGitHub();
    if (endpoint && await health(endpoint)) {
      localStorage.setItem(ENDPOINT_STORE, endpoint);
      setState("ONLINE", "Entrando na call...", true);
      location.replace(endpoint + "/join?k=" + encodeURIComponent(key));
      return;
    }

    attempts++;
    setState("OFFLINE", "A call nÃ£o estÃ¡ acessÃ­vel agora.");
    retry.hidden = false;
  } catch (e) {
    attempts++;
    setState("OFFLINE", "A call nÃ£o estÃ¡ acessÃ­vel agora.");
    retry.hidden = false;
  } finally {
    checking = false;
  }

  setTimeout(() => check(false), force ? 1000 : nextDelay());
}

retry.addEventListener("click", () => {
  attempts = 0;
  check(true);
});

check(false);
</script>
</body>
</html>
