<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <title>Flávio Live</title>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--line:#252d3a;--text:#f4f6fb;--muted:#939cac}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}
    .app{height:100dvh;display:grid;grid-template-rows:54px 1fr}
    .top{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:#0c0f15}
    .brand{font-weight:800;letter-spacing:.5px}
    .hint{font-size:12px;color:var(--muted)}
    .stage{position:relative;min-height:0;background:#000}
    iframe{width:100%;height:100%;border:0;background:#000}
    .gate{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 35%,#171d29 0,#090b10 58%)}
    .gate.hidden{display:none}
    .box{width:min(520px,100%)}
    h1{margin:0 0 10px;font-size:clamp(30px,8vw,52px)}
    p{margin:0 0 20px;color:var(--muted);line-height:1.5}
    button{appearance:none;border:0;border-radius:12px;background:#eef2f8;color:#0c0f15;font-weight:800;font-size:16px;padding:13px 18px;cursor:pointer}
    button:active{transform:scale(.98)}
    .small{margin-top:14px;font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">FLÁVIO LIVE</div>
      <div class="hint">P2P • VDO.Ninja</div>
    </header>
    <section class="stage">
      <iframe id="call"
        allow="camera *; microphone *; fullscreen; display-capture *; autoplay; picture-in-picture"
        referrerpolicy="no-referrer"></iframe>

      <div id="gate" class="gate">
        <div class="box">
          <h1>Entrar na call</h1>
          <p>Abra por aqui para assistir à tela e conversar pelo microfone. A câmera fica desligada por padrão.</p>
          <button id="join">ENTRAR E ASSISTIR</button>
          <div class="small">O navegador pode pedir permissão para usar o microfone.</div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const ROOM = "FNsvuCDVljvQwgAtvF6aCOm7zt8b";
    const PASSWORD = "TY7xYDvYkxsSFfR0QMHcEB0F01wJ";

    function roomUrl(){
      const p = new URLSearchParams();
      p.set("room", ROOM);
      p.set("password", PASSWORD);
      p.set("label", "Convidado");
      p.set("videodevice", "0");
      p.set("autostart", "");
      p.set("videobitrate", "30000");
      p.set("fullscreenbutton", "");
      return "https://vdo.ninja/?" + p.toString().replace(/=(&|$)/g,"$1");
    }

    document.getElementById("join").addEventListener("click", () => {
      document.getElementById("call").src = roomUrl();
      document.getElementById("gate").classList.add("hidden");
    });
  </script>
</body>
</html>
